<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title id="page-title">Migration Progress</title>
<link rel="stylesheet" href="assets/dashboard.css">
</head>
<body>
<header>
  <div>
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="page-h1"></h1>
  </div>
  <div id="updated"><span id="updated-text">updated —</span><span id="stale-badge"></span></div>
</header>

<main>
<div id="conn-error" role="status" style="display:none"></div>

<div class="tiles">
  <div class="tile">
    <div class="l" id="lbl-overall-progress"></div>
    <div class="v"><span id="pct">0</span><small>%</small></div>
    <div class="pbar"><i id="pct-bar" style="width:0%"></i></div>
  </div>
  <div class="tile">
    <div class="l" id="lbl-phases-tile"></div>
    <div class="v" id="phase-count">0 / 0</div>
    <div class="sub" id="phase-remaining"></div>
  </div>
  <div class="tile activity">
    <div class="l" id="lbl-now-running"></div>
    <div class="v" id="current-activity">—</div>
    <div class="phasechip" id="current-phase-chip"></div>
  </div>
</div>

<section aria-labelledby="lbl-actions-h2">
  <h2 id="lbl-actions-h2"></h2>
  <div id="actions"></div>
</section>

<div id="cutover" class="cutover notready">
  <div class="verdict"><span class="dot"></span><span id="verdict-text"></span></div>
  <div class="verdict-sub" id="verdict-sub"></div>
  <div class="gates" id="gates"></div>
</div>

<section aria-labelledby="lbl-outlook-h2">
  <h2 id="lbl-outlook-h2"></h2>
  <div id="outlook"></div>
  <div id="strategy"></div>
</section>

<section aria-labelledby="lbl-risks-h2">
  <h2 id="lbl-risks-h2"></h2>
  <div id="risks"></div>
</section>

<h2 id="lbl-phases-h2"></h2>
<div id="phases"></div>

<h2 id="lbl-soak-h2"></h2>
<div id="soak"></div>

<h2 id="lbl-objects-h2"></h2>
<div id="objects"></div>

<h2 id="lbl-log-h2"></h2>
<div id="log"><div id="log-empty"></div></div>
</main>

<footer id="footer-text"></footer>

<script src="assets/dashboard.js"></script>
</body>
</html>
